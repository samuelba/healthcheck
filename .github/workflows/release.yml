name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: samuelba/actions/release-please@2528c31b37b1f1ce12f27f66eb05b9e1282cdf58 # v1.0.1
        id: release
        with:
          # A fine-grained PAT lets CI run on the release pull request. Without it, the release still works.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
